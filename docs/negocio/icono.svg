<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc"><title id="title">Vigía</title><desc id="desc">Una V firme con un punto terracota en lo alto: el vigía que mira desde la atalaya y ve la causa antes que nadie. La tilde de la í, en terracota, es ese mismo punto.</desc><rect width="160" height="160" rx="36" fill="#FAF7F2"/><g transform="translate(20,14) scale(1)"><path d="M14 34 L60 116 L106 34" fill="none" stroke="#1D5C7A" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 34 L60 72 L81 34" fill="none" stroke="#7FA9BF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="15" r="12.5" fill="#D9824E"/></g></svg>
