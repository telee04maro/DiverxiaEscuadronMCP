[project]
name = "vigia"
version = "0.1.0"
description = "Vigía: un equipo de agentes de IA para toda tu pyme. Especialistas que detectan, un coordinador que cruza la información, actúa y mide."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic==2.12.0",
    "pandas==3.1.1",
    "pydantic==2.14.4",
    "python-dotenv==1.2.4",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "PL", "ANN"]
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
